# GitHub Actions: 自动在 Windows runner 上编译 native 模块 + 打包便携版
# 用户无需本地装 VS Build Tools / Python，直接在 Actions 页面点 Run workflow
# 产物作为 artifact 上传，下载后即用
name: 打包便携版 (Windows)

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      ref:
        description: '要打包的分支/tag/commit（默认 v2.0）'
        required: false
        default: 'v2.0'
  # push 到 v2.0 tag 时自动触发
  push:
    tags:
      - 'v2.0'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || 'v2.0' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Configure npm mirror
        run: |
          npm config set registry https://registry.npmmirror.com
          npm config set electron_mirror https://registry.npmmirror.com/-/binary/electron/
          npm config set electron_builder_binaries_mirror https://registry.npmmirror.com/-/binary/electron-builder-binaries/

      - name: Install dependencies
        # --ignore-scripts 跳过 electron postinstall（镜像可能失效），下一步单独装二进制
        run: npm install --ignore-scripts

      - name: Install electron binary
        # 单独触发 electron 的 install.js，从镜像下载 win32 二进制到 node_modules/electron/dist
        run: node node_modules/electron/install.js
        continue-on-error: true

      - name: Build TS
        run: npm run build:ts

      - name: Build native addon (MSVC)
        # 关键步骤：用 node-gyp 编译 C++ → pixel_native.node
        # Windows runner 自带 VS Build Tools + Windows SDK
        run: npx node-gyp configure build --directory=native --target=28.1.0 --arch=x64 --dist-url=https://registry.npmmirror.com/-/binary/electron/
        env:
          # 强制用 MSVC 工具链
          GYP_MSVS_VERSION: 2022

      - name: Verify native build
        # 检查 .node 文件是否生成
        run: |
          if (Test-Path "native\build\Release\pixel_native.node") {
            Write-Host "✓ pixel_native.node 编译成功"
            Get-Item native\build\Release\pixel_native.node | Format-List
          } else {
            Write-Host "✗ pixel_native.node 未生成，打包将以 WebGL fallback 模式发布"
            dir native\build -Recurse -ErrorAction SilentlyContinue
          }
        shell: pwsh

      - name: Pack portable
        # electron-builder 打包成 dir（便携版，不生成安装器）
        run: npx electron-builder --win --dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: 像素窗口-便携版-v2.0
          path: 像素窗口-便携版/win-unpacked/
          retention-days: 30
          compression-level: 0
